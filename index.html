<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà Bất Ngờ 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .ui-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 10;
        }
        h1 {
            font-size: 2.2rem;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8), 0 0 20px rgba(255, 105, 180, 0.5);
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #ffe4e1;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }
        .btn-open {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #ff4081, #ff80ab);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.6);
            transition: all 0.3s ease;
        }
        .btn-open:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.9);
        }
    </style>
    <!-- Nhúng thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div class="ui-container" id="ui">
        <h1>💖 Dành Tặng Người Đặc Biệt 💖</h1>
        <p>Bấm vào nút bên dưới để mở quà nhé!</p>
        <button class="btn-open" id="btnGift">Mở Quà 3D 🎁</button>
    </div>

    <script>
        let scene, camera, renderer, particles, flowerGroup;
        let isOpen = false;

        function init() {
            const container = document.getElementById('canvas-container');
            
            // Tạo Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff69b4, 2, 50);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            // Tạo các hạt lấp lánh (Particles)
            const particleCount = 1000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for(let i = 0; i < particleCount * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 30;
                positions[i+1] = (Math.random() - 0.5) * 30;
                positions[i+2] = (Math.random() - 0.5) * 30;

                colors[i] = 1; 
                colors[i+1] = Math.random() * 0.5 + 0.5; 
                colors[i+2] = 0.8; 
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Tạo hoa 3D
            flowerGroup = new THREE.Group();
            const petalGeo = new THREE.SphereGeometry(1, 32, 16);
            petalGeo.scale(0.3, 1.5, 0.3);

            const petalMat = new THREE.MeshPhongMaterial({
                color: 0xff1493,
                shininess: 100,
                side: THREE.DoubleSide
            });

            for(let i = 0; i < 12; i++) {
                const petal = new THREE.Mesh(petalGeo, petalMat);
                petal.rotation.z = (i / 12) * Math.PI * 2;
                petal.rotation.y = 0.3;
                petal.position.x = Math.cos((i / 12) * Math.PI * 2) * 1.2;
                petal.position.y = Math.sin((i / 12) * Math.PI * 2) * 1.2;
                flowerGroup.add(petal);
            }

            const centerGeo = new THREE.SphereGeometry(0.8, 32, 32);
            const centerMat = new THREE.MeshPhongMaterial({ color: 0xffd700 });
            const center = new THREE.Mesh(centerGeo, centerMat);
            flowerGroup.add(center);

            flowerGroup.scale.set(0.001, 0.001, 0.001); 
            scene.add(flowerGroup);

            // Xử lý sự kiện bấm nút mở quà
            document.getElementById('btnGift').addEventListener('click', function() {
                isOpen = true;
                const ui = document.getElementById('ui');
                ui.style.opacity = '0';
                ui.style.transition = 'opacity 0.8s';
                setTimeout(() => {
                    ui.style.display = 'none';
                }, 800);
            });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            if (particles) {
                particles.rotation.y += 0.001;
                particles.rotation.x += 0.0005;
            }

            if (flowerGroup && isOpen) {
                flowerGroup.rotation.y += 0.01;
                flowerGroup.rotation.z += 0.005;
                
                if (flowerGroup.scale.x < 2) {
                    flowerGroup.scale.x += 0.04;
                    flowerGroup.scale.y += 0.04;
                    flowerGroup.scale.z += 0.04;
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
