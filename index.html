<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà Bất Ngờ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: #333;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 400px;
            width: 85%;
        }
        h1 { color: #e91e63; margin-bottom: 10px; }
        p { font-size: 1.1em; line-height: 1.6; color: #555; }
        .gift-box {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.3s ease;
            margin: 20px 0;
            user-select: none;
        }
        .gift-box:hover { transform: scale(1.15) rotate(5deg); }
        .message {
            display: none;
            animation: fadeIn 1s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 Gửi Tặng Bạn!</h1>
        <p>Bấm vào hộp quà bên dưới để xem điều bất ngờ nhé!</p>
        
        <div class="gift-box" onclick="openGift()">🎁</div>

        <div class="message" id="secretMessage">
            <h2 style="color: #ff4081;">💖 Chúc Bạn Luôn Vui Vẻ! 💖</h2>
            <p>Mong rằng mỗi ngày của bạn đều ngập tràn niềm vui, may mắn và hạnh phúc!</p>
        </div>
    </div>

    <script>
        function openGift() {
            document.querySelector('.gift-box').style.display = 'none';
            document.getElementById('secretMessage').style.display = 'block';
        }
    </script>
</body>
</html>
