<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Quà Bất Ngờ 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .ui-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            z-index: 10;
            pointer-events: none;
        }
        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8), 0 0 20px rgba(255, 105, 180, 0.5);
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #ffe4e1;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }
        .btn-open {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.1rem;
            background: linear-gradient(45deg, #ff4081, #ff80ab);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 15px rgba(255, 64, 129, 0.6);
            transition: all 0.3s ease;
        }
        .btn-open:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px rgba(255, 64, 129, 0.9);
        }
    </style>
    <!-- Nhúng thư viện Three.js để xử lý 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="ui-container" id="ui">
        <h1>💖 Dành Tặng Người Đặc Biệt 💖</h1>

        <button class="btn-open" onclick="openGift()">Mở Quà 3D 🎁</button>
    </div>

        function init() {
            const container = document.getElementById('canvas-container');
            
            // Tạo Scene & Camera
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 15;

            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            scene.add(ambientLight);

            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            const colors = new Float32Array(particleCount * 3);

                positions[i+1] = (Math.random() - 0.5) * 30;
                positions[i+2] = (Math.random() - 0.5) * 30;

                colors[i] = 1; // R
                colors[i+1] = Math.random() * 0.5 + 0.5; // G
                colors[i+2] = 0.8; // B
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });
